name: trading bot CI

on:
  push:
    branches: [main, test, dbt]
  pull_request:
    branches: [main, test, dbt]

jobs:
  linting-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer Flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Analyser le code avec Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 \
            --max-line-length=127 --statistics

  
  deploy-job:
    runs-on: ubuntu-latest
    needs: linting-job

    # Déploiement uniquement après un PUSH sur main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Authentification Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: jan26-cde-crypto
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      
      - name: Installer gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Debug GCP identities
        run: |
            echo "=== DEPLOYER ==="
            gcloud auth list
      
      - name: Deploy
        run: ./gcr_setup.sh && ./gcr_jobs.sh
  
  dbt-build-job:
    runs-on: ubuntu-latest

    # Déploiement uniquement après un PUSH sur main
    if: github.event_name == 'push' && github.ref == 'refs/heads/dbt'
    
    environment: ${{ github.ref_name == 'dbt' && 'production' || 'dev' }} 

    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
  
      - name: Authentification Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: jan26-cde-crypto
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        
      - name: Installer gcloud
        uses: google-github-actions/setup-gcloud@v3
  
      - name: Debug GCP identities
        run: |
            echo "=== DEPLOYER ==="
            gcloud auth list
        
      - name: Deploy
        run: ./dbt_jobs.sh

    





